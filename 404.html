<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 - Page Introuvable | Monster Prod</title>
<link rel="icon" href="../content/favicon.png" type="image/x-icon" />
<link href="https://fonts.googleapis.com/css2?family=Duplet:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  font-family: 'Poppins', sans-serif;
  background: #111111;
  color: #ffffff;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}
.header {
  width: 100%;
  height: 75px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 8%;
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.header img {
  height: 48px;
  cursor: pointer;
}
.header nav ul {
  display: flex;
  gap: 2rem;
  list-style: none;
}
.header nav a {
  color: #ffffffcc;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s ease;
}
.header nav a:hover {
  color: #ffffff;
}
.error-section {
  flex-grow: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 100px 2rem;
}
.error-content {
  max-width: 700px;
}
.error-code {
  font-family: 'Duplet', sans-serif;
  font-size: clamp(4rem, 8vw, 7rem);
  margin-bottom: 1rem;
}
.error-message {
  font-size: 1.6rem;
  margin-bottom: 1rem;
}
.error-description {
  color: #bbb;
  margin-bottom: 2rem;
  line-height: 1.6;
}
.btn-primary {
  background: #1e40af;
  color: #fff;
  padding: 0.7rem 1.4rem;
  border-radius: 8px;
  font-weight: 600;
  text-decoration: none;
  transition: background-color 0.3s ease;
  display: inline-block;
}
.btn-primary:hover {
  background-color: #374db8;
}
.footer {
  text-align: center;
  padding: 2rem 0;
  margin-top: 3rem;
  color: #aaa;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.footer a {
  color: #aaa;
  text-decoration: none;
  margin: 0 1rem;
  transition: color 0.3s ease;
}
.footer a:hover {
  color: #ffffff;
}
@media (max-width: 768px) {
  .header {
    flex-direction: column;
    height: auto;
    padding: 1rem 0;
  }
  .header nav ul {
    flex-direction: column;
    gap: 1rem;
    align-items: center;
  }
}
</style>
</head>
<body>
<header class="header">
  <img src="../content/logo.png" alt="Monster Prod Logo" onclick="window.location.href='../'"/>
  <nav>
    <ul>
      <li><a href="../#services">Services</a></li>
      <li><a href="../#about">Nous</a></li>
      <li><a href="../#contact">Contact</a></li>
    </ul>
  </nav>
</header>
<section class="error-section">
  <div class="error-content">
    <h1 class="error-code">404</h1>
    <h2 class="error-message">Cette page n'existe pas.</h2>
    <p class="error-description">
      La page que vous recherchez a peut-être été déplacée ou supprimée.
    </p>
    <a href="../" class="btn-primary">Retour à l'accueil</a>
  </div>
</section>
<footer class="footer">
  <div>
    <a href="../legal/">Politique de Confidentialité</a> •
    <a href="../crédits/">Crédits</a>
  </div>
  <p>© Monster Prod <span id="year"></span></p>
</footer>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
